name: Publicar a pagina (GitHub Pages)

# Publica o resultado (index.html + css) para o aluno VER a pagina no navegador.
# O Pages e habilitado automaticamente na primeira execucao (enablement: true) —
# o aluno nao precisa mexer em Settings.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Permissoes necessarias para publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# So uma publicacao por vez.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o codigo do aluno
        uses: actions/checkout@v4

      - name: Configurar o Pages (habilita automaticamente)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Montar o site (so os arquivos da pagina)
        run: |
          mkdir -p _site
          cp index.html _site/ 2>/dev/null || true
          cp -r css _site/     2>/dev/null || true
          cp -r js _site/      2>/dev/null || true
          cp -r img _site/     2>/dev/null || true

      - name: Empacotar
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
